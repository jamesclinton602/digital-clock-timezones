<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Global Time Zones</h1>
        <div class="clocks-grid">
            <div class="clock-card">
                <h2>New York</h2>
                <p class="timezone">(UTC-5 / UTC-4)</p>
                <div class="digital-clock" id="ny-clock">00:00:00</div>
            </div>
            
            <div class="clock-card">
                <h2>London</h2>
                <p class="timezone">(UTC+0 / UTC+1)</p>
                <div class="digital-clock" id="london-clock">00:00:00</div>
            </div>
            
            <div class="clock-card">
                <h2>Tokyo</h2>
                <p class="timezone">(UTC+9)</p>
                <div class="digital-clock" id="tokyo-clock">00:00:00</div>
            </div>
            
            <div class="clock-card">
                <h2>Sydney</h2>
                <p class="timezone">(UTC+10 / UTC+11)</p>
                <div class="digital-clock" id="sydney-clock">00:00:00</div>
            </div>
            
            <div class="clock-card">
                <h2>Dubai</h2>
                <p class="timezone">(UTC+4)</p>
                <div class="digital-clock" id="dubai-clock">00:00:00</div>
            </div>
            
            <div class="clock-card">
                <h2>Los Angeles</h2>
                <p class="timezone">(UTC-8 / UTC-7)</p>
                <div class="digital-clock" id="la-clock">00:00:00</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
